<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="打开 .ics 邀请，对照三个时区，核对夏令时和浮动时间。邀请文件在本机读取。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <link rel="canonical" href="https://thitrang20160-cell.github.io/invitescope/">
  <title>InviteScope · 日历邀请时区核对</title>
  <style>:root {
  color-scheme: light;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: #1e2842;
  background: #f5f5f0;
  --ink: #1e2842;
  --muted: #515c70;
  --line: #d9dbd4;
  --surface: #fffefa;
  --accent: #323c86;
}
* { box-sizing: border-box; }
body { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
.layout { width: min(100%, 1150px); padding: 0 30px 32px; margin: auto; }
.masthead { min-height: 67px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.masthead nav { font-size: .87rem; }
.brand { font-size: 1.20rem; font-weight: 780; text-decoration: none; color: var(--ink); letter-spacing: -.025em; }
.hero { padding: 37px 0 27px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3.45rem); line-height: 1.15; letter-spacing: -.05em; margin-bottom: 12px; }
.hero p, .hint, footer { color: var(--muted); line-height: 1.55; }
.workspace { display: grid; grid-template-columns: minmax(238px, .9fr) minmax(0, 2.5fr); gap: 16px; align-items: start; }
.controls, .result { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; }
.controls { padding: 17px; }
.control-section + .control-section { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
.controls h2 { font-size: .94rem; margin-bottom: 8px; }
.example-list { display: grid; gap: 5px; }
.example-list a { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: .9rem; }
.example-list a:hover, .example-list [aria-current] { background: #eaebfa; color: var(--accent); }
.controls label { display: grid; gap: 4px; font-size: .85rem; }
.controls label[hidden] { display: none; }
select, input { font: inherit; color: var(--ink); min-width: 0; }
select, #share-url { min-height: 34px; background: #f8f8f4; border: 1px solid #c6c9c1; border-radius: 5px; padding-inline: 5px; width: 100%; }
.file-label { padding: 7px 0; }
.hint { margin-top: 7px; font-size: .78rem; }
.zones label + label { margin-top: 6px; }
.result { min-height: 330px; padding: 19px 22px; }
#message:not(:empty) { margin-bottom: 10px; color: #9a3611; }
.result-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.heading { min-width: 0; overflow-wrap: anywhere; }
#event-title { font-size: clamp(1.22rem, 4vw, 1.65rem); margin: 3px 0 5px; }
#mode, #reference { color: var(--muted); font-size: .84rem; line-height: 1.55; }
button { font: inherit; padding: 7px 10px; min-height: 38px; border-radius: 6px; border: 1px solid var(--accent); color: white; background: var(--accent); white-space: nowrap; cursor: pointer; }
button:hover { background: #454fa3; }
:focus-visible { outline: 2px solid #495cc3; outline-offset: 3px; }
ul { padding: 0; list-style: none; }
#times { margin: 9px 0 0; }
.time-row { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(0, 2fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.time-row strong { overflow-wrap: anywhere; font-size: .87rem; }
.time-row time { font: 1.02rem ui-monospace, Consolas, monospace; }
.time-row small { color: var(--muted); display: block; margin-top: 3px; }
#warnings { background: #fff6dc; color: #644812; padding: 10px 12px; font-size: .87rem; border-radius: 6px; margin: 14px 0 0; line-height: 1.55; }
#warnings li + li { margin-top: 5px; }
.sharing { padding: 12px; margin-top: 15px; border: 1px solid var(--line); border-radius: 7px; }
.sharing label { font-weight: 700; }
.sharing p { font-size: .83rem; margin: 4px 0; color: var(--muted); }
.sharing > div { display: flex; gap: 7px; }
footer { margin-top: 16px; font-size: .83rem; }
@media (max-width: 670px) {
  .layout { padding-inline: 15px; }
  .hero { padding: 21px 0 16px; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .result { grid-row: 1; padding: 14px; }
  .result-head { gap: 9px; flex-wrap: wrap; }
  .time-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
</style>
</head>
<body>
  <main class="layout">
    <header class="masthead">
      <a href="?" class="brand">InviteScope</a>
      <nav aria-label="项目链接"><a href="https://github.com/thitrang20160-cell/invitescope" target="_blank" rel="noopener noreferrer">GitHub 源码 ↗</a></nav>
    </header>
    <section class="hero" aria-labelledby="title">
      <h1 id="title">这场会议，到底几点？</h1>
      <p>导入 .ics 邀请，对照三个时区，看看夏令时回拨、跨日和缺失时区会怎样影响日程。</p>
    </section>
    <div class="workspace">
      <aside class="controls" aria-label="选择日程和时区">
        <div class="control-section">
          <h2>试用样例</h2>
          <nav class="example-list" aria-label="试用样例">
            <a id="sample-fold" href="?example=fold">夏令时回拨 <span aria-hidden="true">↗</span></a>
            <a id="sample-floating" href="?example=floating">邀请缺少时区 <span aria-hidden="true">↗</span></a>
            <a id="sample-rollover" href="?example=rollover">跨日会议 <span aria-hidden="true">↗</span></a>
          </nav>
        </div>
        <div class="control-section">
          <h2>核对自己的邀请</h2>
          <label id="file-display" class="file-label"><span>选择 .ics 文件</span><input id="file" type="file" accept=".ics,.ical,text/calendar" aria-label="选择 .ics 文件"></label>
          <label id="event-control" hidden>选择日程 <select id="event"></select></label>
          <p class="hint">文件留在本机。选择文件即可查看结果。</p>
        </div>
        <div class="control-section zones">
          <h2>对照时区</h2>
          <label>时区 1 <select id="zone-one"></select></label>
          <label>时区 2 <select id="zone-two"></select></label>
          <label>时区 3 <select id="zone-three"></select></label>
        </div>
      </aside>
      <section id="result" class="result" aria-labelledby="event-title">
        <p id="message" role="status" aria-live="polite"></p>
        <div id="report" hidden>
          <div class="result-head">
            <div class="heading">
              <p id="mode"></p>
              <h2 id="event-title"></h2>
              <p id="reference"></p>
            </div>
            <button id="share" type="button">生成分享链接</button>
          </div>
          <ul id="times" aria-label="各时区的日程时间"></ul>
          <ul id="warnings" aria-label="时区提示" hidden></ul>
          <div id="sharing" class="sharing" hidden>
            <label for="share-url">分享核对结果</label>
            <p>链接包含时间、对照时区和提示。标题、参会人、地点和会议链接留在本机。</p>
            <div><input id="share-url" readonly><button id="copy" type="button">复制</button></div>
            <p id="copy-status" role="status"></p>
          </div>
        </div>
      </section>
    </div>
    <footer>适合核对单次邀请及重复日程的文件所列时间。具体客户端如何导入，以其实际显示为准。</footer>
  </main>

  recurrence: '文件包含重复规则或例外。此处只显示选中条目所列的时间。',
  duration: '文件用 DURATION 指定时长。本版只显示开始时间。',
  canceled: '文件把此日程标记为取消。',
};
const names = {
  'America/New_York': '纽约', 'America/Los_Angeles': '洛杉矶', 'Europe/London': '伦敦',
  'Asia/Shanghai': '北京时间', 'Asia/Tokyo': '东京', 'Asia/Kolkata': '印度时间', 'UTC': 'UTC',
};
const sample = (title, start, end) => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//InviteScope//Demo//EN',
  'BEGIN:VEVENT', 'UID:demo@example.invalid', 'DTSTAMP:20261120T120000Z', 'SUMMARY:' + title, start, end,
  'END:VEVENT', 'END:VCALENDAR', ''].join('\r\n');
const examples = {
  fold: sample('纽约 01:30 出现了两次', 'DTSTART;TZID=America/New_York:20261101T013000', 'DTEND;TZID=America/New_York:20261101T023000'),
  floating: sample('各地的 09:30 是同一场会议吗？', 'DTSTART:20261203T093000', 'DTEND:20261203T100000'),
  rollover: sample('伦敦周四晚上，北京已是周五', 'DTSTART:20261203T233000Z', 'DTEND:20261204T000000Z'),
};
let source;
let model;
let shared = false;
let selectedZones = [...defaultZones];
let importRevision = 0;

const iso = epoch => new Date(epoch).toISOString().replace('.000Z', 'Z');
const spaced = value => value.replace('T', ' ').replace(/Z$/, ' UTC');
const selectedTitle = data => data.title || '日历邀请时间核对';

function text(tag, value) {
  const element = document.createElement(tag);
  element.textContent = value;
  return element;
}

function offsetLabel(offset) {
  const sign = offset >= 0 ? '+' : '−';
  const seconds = Math.abs(offset) / 1000;
  const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
  const minutes = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
  const rest = seconds % 60 ? ':' + String(seconds % 60).padStart(2, '0') : '';
  return 'UTC' + sign + hours + ':' + minutes + rest;
}

function timeRow(data, zone) {
  const row = document.createElement('li');
  row.className = 'time-row';
  row.dataset.zone = zone;
  row.append(text('strong', names[zone] ? names[zone] + ' · ' + zone : zone));
  const body = document.createElement('div');
  row.append(body);
  if (data.kind === 'date') {
    body.append(text('time', iso(data.start).slice(0, 10)));
    if (data.end !== null) body.append(text('small', '结束日期不含当天 ' + iso(data.end).slice(0, 10)));
    return row;
  }
  if (data.kind === 'floating') {
    const start = spaced(iso(data.start).slice(0, -1));
    body.append(text('time', start + '（当地）'));
    const local = InviteScope.resolveIana(data.start, zone);
    body.append(text('small', '在此时区开始相当于 ' + spaced(iso(local.instant)) +
      (local.warning ? '，当天有夏令时变更' : '')));
    return row;
  }
  const start = InviteScope.localParts(data.start, zone);
  const end = data.end === null ? null : InviteScope.localParts(data.end, zone);
  body.append(text('time', spaced(start.iso)));
  body.append(text('small', offsetLabel(start.offset) + (end ? ' · 结束 ' + spaced(end.iso) +
    (end.offset !== start.offset ? ' ' + offsetLabel(end.offset) : '') : '')));
  return row;
}

function report() {
  get('message').textContent = '';
  get('sharing').hidden = true;
  get('report').hidden = !model;
  if (!model) return;
  get('mode').textContent = shared ? '链接中的时间预览 · 未读取原始邀请' :
    ({ fixed: '固定时间', floating: '浮动时间', date: '全天日程' }[model.kind]);
  get('event-title').textContent = selectedTitle(model);
  let reference;
  if (model.kind === 'fixed') reference = spaced(iso(model.start)) + (model.end === null ? '' : ' → ' + spaced(iso(model.end)));
  else if (model.kind === 'date') reference = '全天日期在各时区保持一致。';
  else reference = '邀请没有指定一个全世界共同的开始时刻。';
  if (model.sourceZone) reference += ' · 邀请时区 ' + model.sourceZone;
  get('reference').textContent = reference;
  get('times').replaceChildren(...selectedZones.map(zone => timeRow(model, zone)));
  get('warnings').replaceChildren(...model.warnings.map(code => text('li', warnings[code])));
  get('warnings').hidden = !model.warnings.length;
}

function fail(error) {
  model = null;
  report();
  get('message').textContent = error instanceof Error ? error.message : String(error);
}

function openEvent() {
  try {
    model = InviteScope.inspect(source, Number(get('event').value) || 0);
    report();
  } catch (error) { fail(error); }
}

function loadCalendar(data, example) {
  source = InviteScope.parse(data);
  shared = false;
  const selector = get('event');
  selector.replaceChildren(...source.events.map((event, index) => {
    const option = text('option', String(event.getFirstPropertyValue('summary') || '日程 ' + (index + 1)).slice(0, 250));
    option.value = String(index);
    return option;
  }));
  get('event-control').hidden = source.events.length === 1 && Boolean(example);
  openEvent();
}

function renderZones() {
  zoneControls.forEach((control, index) => {
    const selected = selectedZones[index];
    if (![...control.options].some(option => option.value === selected)) {
      const option = text('option', selected);
      option.value = selected;
      control.append(option);
    }
    control.value = selected;
    for (const option of control.options) {
      option.disabled = selectedZones.includes(option.value) && option.value !== selected;
    }
  });
}

const otherZones = Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') :
  ['America/Chicago', 'Asia/Singapore', 'Australia/Sydney', 'Europe/Paris'];
const zoneList = [...new Set(['UTC', ...defaultZones, ...otherZones])];
zoneControls.forEach((control, index) => {
  control.replaceChildren(...zoneList.map(zone => {
    const option = text('option', names[zone] ? names[zone] + ' · ' + zone : zone);
    option.value = zone;
    return option;
  }));
  control.addEventListener('change', () => {
    selectedZones[index] = control.value;
    renderZones();
    if (model) report();
  });
});
get('event').addEventListener('change', openEvent);
get('file').addEventListener('change', async event => {
  const revision = ++importRevision;
  const file = event.target.files[0];
  if (!file) return;
  source = null;
  get('event-control').hidden = true;
  model = null;
  report();
  document.querySelector('[aria-current="page"]')?.removeAttribute('aria-current');
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  try {
    if (file.size > 262144) throw new Error('请选择小于 256 KiB 的 .ics 文件。');
    const content = new TextDecoder('utf-8', { fatal: true }).decode(await file.arrayBuffer());
    if (revision === importRevision) loadCalendar(content, false);
  } catch (error) { if (revision === importRevision) fail(error); }
});

get('share').addEventListener('click', () => {
  try {
    const result = new URL(location.protocol === 'file:' ?
      'https://thitrang20160-cell.github.io/invitescope/' : location.href);
    result.search = '';
    result.hash = 'r=' + InviteScope.encode(model, selectedZones);
    get('share-url').value = result.href;
    get('copy-status').textContent = '';
    get('sharing').hidden = false;
    get('share-url').focus();
    get('share-url').select();
  } catch (error) { get('message').textContent = error.message; }
});
get('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(get('share-url').value);
    get('copy-status').textContent = '已复制结果链接。';
  } catch {
    get('share-url').focus();
    get('share-url').select();
    get('copy-status').textContent = '链接已选中，可以用键盘复制。';
  }
});

try {
  const url = new URL(location.href);
  if (url.hash.startsWith('#r=')) {
    model = InviteScope.decode(url.hash.slice(3));
    shared = true;
    selectedZones = model.zones;
    report();
  } else {
    const requested = url.searchParams.get('example');
    const example = Object.hasOwn(examples, requested) ? requested : 'fold';
    get('sample-' + example).setAttribute('aria-current', 'page');
    loadCalendar(examples[example], true);
  }
} catch (error) { fail(error); }
renderZones();
</script>
</body>
</html>
